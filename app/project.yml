# Generates PadDeck.xcodeproj:  brew install xcodegen && xcodegen
name: PadDeck
options:
  bundleIdPrefix: com.douglasneto
  developmentLanguage: en
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "237757YZ76"          # your Apple Developer Team ID
targets:
  PadDeck:
    type: application
    platform: iOS
    sources:
      - path: PadDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.douglasneto.paddeck
        PRODUCT_NAME: PadDeck
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: PadDeck/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
